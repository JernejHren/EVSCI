name: Tests

on:
  push:
    branches: [main, dev, devcl]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install test requirements
        run: pip install -r requirements_test.txt
      - name: Run tests with coverage
        run: pytest tests --cov=custom_components.evsci --cov-report=term-missing --cov-fail-under=95

  typing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install requirements
        run: pip install -r requirements_test.txt mypy
      - name: Strict type check
        run: mypy
